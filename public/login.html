<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - EcoQuest</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <header class="header">
        <nav class="navbar">
            <div class="nav-brand">
                <i class="fas fa-leaf"></i>
                <span>EcoQuest</span>
            </div>
            <div class="nav-links">
                <a href="/">Home</a>
                <a href="/register">Register</a>
                <a href="/admin-login">Admin</a>
            </div>
        </nav>
    </header>

    <main>
        <div class="form-container">
            <div style="text-align: center; margin-bottom: 2rem;">
                <i class="fas fa-leaf" style="font-size: 3rem; color: #4CAF50; margin-bottom: 1rem;"></i>
                <h1 style="color: #2d5a27; margin-bottom: 0.5rem;">Welcome Back!</h1>
                <p style="color: #666;">Sign in to continue your eco journey</p>
            </div>

            <div id="alert-container"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">
                        <i class="fas fa-envelope"></i>
                        Email Address
                    </label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="password">
                        <i class="fas fa-lock"></i>
                        Password
                    </label>
                    <input type="password" id="password" name="password" required>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-bottom: 1rem;">
                    <i class="fas fa-sign-in-alt"></i>
                    <span id="login-text">Sign In</span>
                    <span id="login-loading" class="loading" style="display: none;"></span>
                </button>
            </form>

            <div style="text-align: center; margin-top: 2rem;">
                <p style="color: #666; margin-bottom: 1rem;">Don't have an account?</p>
                <a href="/register" class="btn btn-secondary">
                    <i class="fas fa-user-plus"></i>
                    Create Account
                </a>
            </div>

            <div style="text-align: center; margin-top: 2rem; padding-top: 2rem; border-top: 1px solid #e0e0e0;">
                <p style="color: #666; margin-bottom: 1rem;">Administrator?</p>
                <a href="/admin-login" class="btn btn-admin">
                    <i class="fas fa-shield-alt"></i>
                    Admin Portal
                </a>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-brand">
                    <i class="fas fa-leaf"></i>
                    <span>EcoQuest</span>
                </div>
                <div class="footer-links">
                    <a href="/">Home</a>
                    <a href="/register">Register</a>
                    <a href="/admin-login">Admin</a>
                </div>
            </div>
            <div class="footer-bottom">
                <p>&copy; 2024 EcoQuest. Making the world greener, one challenge at a time.</p>
            </div>
        </div>
    </footer>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const loginText = document.getElementById('login-text');
            const loginLoading = document.getElementById('login-loading');
            const alertContainer = document.getElementById('alert-container');
            
            // Show loading state
            loginText.style.display = 'none';
            loginLoading.style.display = 'inline-block';
            
            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, password }),
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    // Store token in localStorage
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    
                    // Show success message
                    alertContainer.innerHTML = `
                        <div class="alert alert-success">
                            <i class="fas fa-check-circle"></i>
                            Login successful! Redirecting...
                        </div>
                    `;
                    
                    // Redirect to dashboard (admins should use admin-login page)
                    setTimeout(() => {
                        window.location.href = '/dashboard';
                    }, 1500);
                } else {
                    // Show error message
                    alertContainer.innerHTML = `
                        <div class="alert alert-error">
                            <i class="fas fa-exclamation-circle"></i>
                            ${data.message}
                        </div>
                    `;
                }
            } catch (error) {
                alertContainer.innerHTML = `
                    <div class="alert alert-error">
                        <i class="fas fa-exclamation-circle"></i>
                        Network error. Please try again.
                    </div>
                `;
            } finally {
                // Reset loading state
                loginText.style.display = 'inline';
                loginLoading.style.display = 'none';
            }
        });

        // Check if user is already logged in
        window.addEventListener('load', () => {
            const token = localStorage.getItem('token');
            const user = JSON.parse(localStorage.getItem('user') || '{}');
            
            if (token && user.id && !user.isAdmin) {
                window.location.href = '/dashboard';
            }
        });
    </script>
</body>
</html>
